# ============================================================
# Personal data (EN) for the header and the Experience,
# Education, Publications, Contacts sections. All sections optional.
# ============================================================

name: "First Last"
title: "Python Developer · Graphics Programming"

# Browser tab title and the brand label in the site header.
# Leave empty to fall back to name.
site_title: "First Last · Portfolio"
brand: "code&shaders"

tagline: "I build tools in Python and experiment with graphics and shaders."

# Avatar: put a file in static/ and reference it relative to static/, e.g. "img/avatar.jpg"
avatar: ""

email: "you@example.com"
location: "City, Country"

socials:
  - { label: "GitHub", url: "https://github.com/username" }
  - { label: "Telegram", url: "https://t.me/username" }
  - { label: "ArtStation", url: "https://artstation.com/username" }

# ---------- Work experience ----------
# start / end: "YYYY-MM" (or just "YYYY", meaning January).
# An empty end means "still working here". The period label ("May 2023 –
# present") and the durations are computed automatically. To write the label
# by hand, add a `period` field: it overrides the computed one.
#
# highlights: either plain strings or groups with a heading:
#   highlights:
#     - "Ungrouped bullet"
#     - group: "Group heading"
#       items: ["Bullet", "Another bullet"]
#
# Descriptions and bullets support Markdown: [label](https://link), **bold**,
# lists. A bare https://... address becomes a link too. Write multi-line text
# as a `|` block, so a blank line starts a new paragraph:
#   description: |
#     First paragraph.
#
#     Second paragraph.
# Inside quotes YAML folds the lines into one and the paragraphs are lost.
experience:
  - start: "2023-01"   # put the real starting month here
    end: ""
    role: "Python Developer"
    company: "Company"
    description: "Short summary of the role and responsibilities."
    highlights:
      - group: "NLP / LLM"
        items:
          - "Key achievement or task #1"
          - "Achievement #2"
      - group: "Computer vision"
        items:
          - "Achievement #3"
  - start: "2021-01"   # put the real months here
    end: "2022-12"
    role: "Junior Developer"
    company: "Another company"
    description: "What I worked on."

# ---------- Education ----------
education:
  - period: "2017 — 2021"
    degree: "BSc, Applied Mathematics"
    school: "University"
    description: "Specialization, if relevant."

# ---------- Publications ----------
# Papers, talks, posts. url/venue/description are optional.
publications:
  - title: "Paper or talk title"
    authors: "Last F., Coauthor A."
    venue: "Journal / conference name"
    year: 2024
    url: "https://doi.org/..."
    description: "One or two sentences about the work."
  - title: "Second talk / paper"
    authors: "Last F."
    venue: "Conference XYZ"
    year: 2023
    url: ""
    description: ""