# ---------- Публикации ----------
# Статьи, доклады, посты. Поля url/venue/description опциональны.
publications:
  - title: "On automated workflow for fine-tuning deepneural network models for table detection in document images"
    authors: "Igor Cherepanov, Andrey Mikhailov, Alexey Shigarov, and Viacheslav Paramonov"
    venue: "43rd International Convention on Information, Communication and Electronic Technology, MIPRO 2020 - Proceedings, 2020, pages 1130–1133"
    year: 2020
    url: "https://doi.org/10.23919/MIPRO48935.2020.9245241"
    description: "Nowadays methods and software for extracting tables from document images and portable documents (PDF) continue to be actively developed. One of the promising approaches to this task is the usage of fine-tuned object detection models. However, this approach involves many manipulations with data preparation and training process configuration. This paper proposes an automated workflow for fine-tuning deep neural network models for the table detection in document images. It enables us to automate two sub-tasks: (i) preparing a training dataset in the PascalVOC format with image transformation and augmentation; (ii) training a table detection model by using the well-known Faster R-CNN architecture. Implementation of the workflow design simplifies the use of the approach proposed by decreasing the number of required manipulations."
  - title: "On Graph-Based Verification for PDF Table Detection"
    authors: "Andrey Mikhailov, Alexey Shigarov, Egor Rozhkov, and Igor Cherepanov"
    venue: "Ivannikov Ispras Open Conference (ISPRAS)"
    year: 2020
    url: "https://doi.org/10.1109/ISPRAS51486.2020.00020"
    description: "Many non-editable documents are shared in PDF (Portable Document Format). They are typically not accompanied by tags for annotating the page layout, including table positions. One of the important challenges of the analysis and understanding of such documents is table detection. This paper outlines a novel two-phase approach to the table detection in untagged PDF documents. The first phase uses deep neural networks (DNN) to predict some table candidates. The second phase selects probable tables from the candidates by verifying their graph representation. We build a weighted directed graph from text blocks inside a predicted area of a table. A set of such graphs produced from the “ICDAR 2013 Table Competition” dataset allowed us to train a verification model based on the Random Forest technique. The empirical results for competitive dataset demonstrated high performance of our implementation of this approach. We showed that additional verification enables reduction of errors and improvement of results of the PDF table detection."
  - title: "Towards end-to-end transformation of arbitrary tables from untagged portable documents (PDF) to linked data"
    authors: "Alexey Shigarov, Igor Cherepanov, Evgeniy Cherkashin, Nikita Dorodnykh, Vasiliy Khristyuk, Andrey Mikhailov , Viacheslav Paramonov, Egor Rozhkow, and Alexandr Yurin"
    venue: "CEUR Workshop Proceedings, 2463, pages 1–12"
    year: 2019
    url: "http://ceur-ws.org/Vol-2463/paper1.pdf"
    description: "The paper is devoted to the problem of an end-to-end table transformation from untagged portable documents (PDF) to linked data. It covers the issues of the table extraction from documents, the reconstruction of logical table structure, the conceptualization of their natural-language content, and the linking of extracted data with external vocabularies. We consider some perspective approaches for the deeplearning-based table detection, heuristic-based table structure recognition, rule-based table analysis, and knowledge-based table interpretation. They can be used as a basis to develop a consistent solution for this problem. Our application experience confirms that such solutions are demanded for populating databases and generating ontologies with tabular data being extracted from weakly and semi-structured documents."